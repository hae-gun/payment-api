spring:
  application:
    name: payment-api

  datasource:
    url: jdbc:mysql://localhost:3306/payment?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

payment:
  pg:
    base-url: http://localhost:8080/simulator/pg
    connect-timeout: 1s
    read-timeout: 3s
  reconciliation:
    interval: 1m
    max-retry: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.hyegeun.payment: DEBUG
